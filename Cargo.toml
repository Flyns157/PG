[package]
name = "pg"
version = "3.0.0"
edition = "2024"
description = "Password Gestion : gestionnaire de mots de passe local, autonome, en TUI et en GUI"
license = "MIT"
repository = "https://github.com/Flyns157/PG"

[features]
default = ["tui", "gui"]
tui = ["dep:ratatui"]
gui = ["dep:eframe", "dep:rfd"]

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1

# Sans optimisation, la dérivation Argon2 prendrait plusieurs secondes en debug.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[dependencies]
arboard = "3.7.0"
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
directories = "6.0.0"
eframe = { version = "0.32.3", optional = true }
fuzzy-matcher = "0.3.7"
rand = "0.10.3"
ratatui = { version = "0.29.0", optional = true }
rfd = { version = "0.17", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
egui_kittest = "0.32"
tempfile = "3.27.0"
